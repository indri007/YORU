<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1A2238" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0E1017" stop-opacity="1"/>
      <stop offset="100%" stop-color="#07080C" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCE7B2" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E8B64C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8B64C" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Robot Head Shading -->
    <radialGradient id="headShade" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2A344D"/>
      <stop offset="50%" stop-color="#192033"/>
      <stop offset="100%" stop-color="#0D111C"/>
    </radialGradient>

    <!-- 3D Robot Body Shading -->
    <radialGradient id="bodyShade" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#242C40"/>
      <stop offset="70%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#0A0C13"/>
    </radialGradient>

    <!-- Golden Visor Glow -->
    <linearGradient id="goldVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B5"/>
      <stop offset="50%" stop-color="#E8B64C"/>
      <stop offset="100%" stop-color="#B8861B"/>
    </linearGradient>

    <!-- Ear Pod Gradients -->
    <linearGradient id="earPod" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8B64C"/>
      <stop offset="100%" stop-color="#1A2030"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bgGlow)"/>

  <!-- Subtle Grid Lines (Cybersecurity OS Grid) -->
  <g opacity="0.12" stroke="#E8B64C" stroke-width="0.75" stroke-dasharray="4,4">
    <line x1="50" y1="0" x2="50" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="250" y1="0" x2="250" y2="450"/>
    <line x1="350" y1="0" x2="350" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="550" y1="0" x2="550" y2="450"/>
    <line x1="650" y1="0" x2="650" y2="450"/>
    <line x1="750" y1="0" x2="750" y2="450"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Ambient Gold Light Field behind Yoru -->
  <circle cx="400" cy="210" r="190" fill="url(#goldGlow)"/>

  <!-- Background Orbit Rings -->
  <ellipse cx="400" cy="225" rx="240" ry="85" fill="none" stroke="#E8B64C" stroke-width="1.2" opacity="0.3" stroke-dasharray="8,6" transform="rotate(-12 400 225)"/>
  <ellipse cx="400" cy="225" rx="190" ry="60" fill="none" stroke="#A5B4FC" stroke-width="0.8" opacity="0.25" transform="rotate(18 400 225)"/>

  <!-- Floating Sparkles & Constellation Dots -->
  <g fill="#FCE7B2" filter="url(#starGlow)">
    <circle cx="180" cy="110" r="2.5" opacity="0.8"/>
    <circle cx="240" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="620" cy="130" r="3" opacity="0.9"/>
    <circle cx="670" cy="90" r="2" opacity="0.7"/>
    <circle cx="160" cy="330" r="2" opacity="0.6"/>
    <circle cx="650" cy="310" r="2.5" opacity="0.75"/>
    <polygon points="210,140 213,148 221,151 213,154 210,162 207,154 199,151 207,148" fill="#E8B64C" opacity="0.8"/>
    <polygon points="590,190 592,195 597,197 592,199 590,204 588,199 583,197 588,195" fill="#E8B64C" opacity="0.9"/>
  </g>

  <!-- =================================================================== -->
  <!-- 3D YORU CHARACTER MASCOT -->
  <!-- =================================================================== -->
  <g transform="translate(0, -5)">

    <!-- Floating Halo Torus above Head -->
    <ellipse cx="400" cy="82" rx="65" ry="16" fill="none" stroke="url(#goldVisor)" stroke-width="7" opacity="0.85" filter="url(#softGlow)"/>
    <ellipse cx="400" cy="82" rx="65" ry="16" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

    <!-- Left Floating Hand / Arm -->
    <g transform="translate(265, 235)">
      <ellipse cx="0" cy="0" rx="20" ry="24" fill="url(#bodyShade)" stroke="#2F3950" stroke-width="1.5"/>
      <ellipse cx="0" cy="-4" rx="8" ry="10" fill="#E8B64C" opacity="0.75" filter="url(#softGlow)"/>
    </g>

    <!-- Right Floating Hand / Waving Arm -->
    <g transform="translate(535, 205)">
      <ellipse cx="0" cy="0" rx="20" ry="24" fill="url(#bodyShade)" stroke="#2F3950" stroke-width="1.5" transform="rotate(-20)"/>
      <ellipse cx="0" cy="-4" rx="8" ry="10" fill="#E8B64C" opacity="0.8" filter="url(#softGlow)"/>
      <!-- Small Sparkle above waving hand -->
      <polygon points="18,-20 20,-15 25,-13 20,-11 18,-6 16,-11 11,-13 16,-15" fill="#FFE8B5" opacity="0.95"/>
    </g>

    <!-- Capsule Body -->
    <g>
      <rect x="330" y="225" width="140" height="120" rx="60" fill="url(#bodyShade)" stroke="#2E374D" stroke-width="2"/>
      <!-- Chest Emblem: Kernel Shield & Night Star -->
      <circle cx="400" cy="275" r="22" fill="#0A0D14" stroke="#E8B64C" stroke-width="2"/>
      <polygon points="400,260 404,271 415,275 404,279 400,290 396,279 385,275 396,271" fill="url(#goldVisor)" filter="url(#softGlow)"/>
      <!-- Kernel Status LED -->
      <circle cx="400" cy="318" r="4" fill="#34D399" filter="url(#softGlow)"/>
      <circle cx="400" cy="318" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Big Round 3D Head -->
    <circle cx="400" cy="165" r="88" fill="url(#headShade)" stroke="#323C54" stroke-width="2.5" filter="url(#softGlow)"/>

    <!-- Ear Antennas / Audio Sensors -->
    <ellipse cx="308" cy="165" rx="8" ry="22" fill="url(#earPod)" stroke="#E8B64C" stroke-width="1.5"/>
    <ellipse cx="492" cy="165" rx="8" ry="22" fill="url(#earPod)" stroke="#E8B64C" stroke-width="1.5"/>

    <!-- Face Visor Display (Dark Glass) -->
    <ellipse cx="400" cy="168" rx="66" ry="52" fill="#06080D" stroke="#1F2636" stroke-width="2"/>
    <ellipse cx="400" cy="148" rx="54" ry="22" fill="#141A28" opacity="0.5"/>

    <!-- Glowing Golden Eyes (Cute Cyber-Eyes) -->
    <g filter="url(#softGlow)">
      <!-- Left Eye -->
      <ellipse cx="372" cy="168" rx="10" ry="17" fill="url(#goldVisor)"/>
      <ellipse cx="370" cy="162" rx="4" ry="6" fill="#FFFFFF"/>
      <circle cx="376" cy="176" r="2" fill="#FFEAA7"/>

      <!-- Right Eye -->
      <ellipse cx="428" cy="168" rx="10" ry="17" fill="url(#goldVisor)"/>
      <ellipse cx="426" cy="162" rx="4" ry="6" fill="#FFFFFF"/>
      <circle cx="432" cy="176" r="2" fill="#FFEAA7"/>
    </g>

    <!-- Cute Blush Marks -->
    <ellipse cx="348" cy="188" rx="7" ry="4" fill="#E8B64C" opacity="0.35"/>
    <ellipse cx="452" cy="188" rx="7" ry="4" fill="#E8B64C" opacity="0.35"/>

    <!-- Gentle Smile -->
    <path d="M 390 192 Q 400 200 410 192" fill="none" stroke="#E8B64C" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Bottom Hero Banner Text -->
  <text x="400" y="398" font-family="'Outfit', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#F2EFE6" text-anchor="middle" letter-spacing="3">
    YORU HARNESS : 3D AI NIGHT GUARDIAN
  </text>
  <text x="400" y="422" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#E8B64C" text-anchor="middle" letter-spacing="1.5">
    CLOSED-LOOP KERNEL GOVERNANCE &#8226; CONSTRAINED ACTION SPACE &#8226; ASR = 0.0%
  </text>
</svg>
