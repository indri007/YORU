      <text x="12" y="18" class="node-text">RISKY: K01 Disable Root SSH</text>
      <text x="12" y="28" class="node-sub">Requires Owner Approval</text>

      <rect y="45" width="240" height="35" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
