    <text x="20" y="46" class="subtitle">Complete Autonomous Defense Loop (Kernel &rarr; LLM &rarr; Gate &rarr; Audit)</text>

    <!-- Ring Hexagon Nodes -->
    <!-- Top: Kernel -->
