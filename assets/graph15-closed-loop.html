<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>YORU Closed-Loop Graph — Graph #15</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #0E0F14;
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    color: #F2EFE6;
    padding: 56px 32px;
    box-sizing: border-box;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #8A8777; font-size: 14px; margin: 0 0 40px; }
  svg { width: 100%; height: auto; display: block; }
  .node-label { font-size: 14px; font-weight: 600; fill: #F2EFE6; }
  .node-sub { font-size: 11px; fill: #9A978A; }
  .edge-label { font-size: 11.5px; fill: #C9C6B8; }
  .legend { margin-top: 36px; display: flex; gap: 28px; flex-wrap: wrap; font-size: 12.5px; color: #8A8777; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Graph #15 — YORU Closed-Loop Graph</h1>
  <p class="sub">Master Architecture · Log → LLM → Gate → Action → Audit (directed, non-repudiable loop)</p>

  <svg viewBox="0 0 980 560" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#E8B64C"/>
      </marker>
    </defs>

    <!-- Hexagon ring layout: 6 nodes around a loop -->
    <!-- Node 1: Kernel (top) -->
    <rect x="390" y="30" width="200" height="72" rx="14" fill="#15161D" stroke="#E8B64C" stroke-width="1.6"/>
    <text x="490" y="60" text-anchor="middle" class="node-label">1. Linux Kernel</text>
    <text x="490" y="78" text-anchor="middle" class="node-sub">Syscall &amp; Config Drift</text>

    <!-- Node 2: Log Sanitizer (upper right) -->
    <rect x="690" y="150" width="220" height="72" rx="14" fill="#15161D" stroke="#3B82F6" stroke-width="1.6"/>
    <text x="800" y="180" text-anchor="middle" class="node-label">2. Log Sanitizer</text>
    <text x="800" y="198" text-anchor="middle" class="node-sub">Delimiter Encapsulation</text>

    <!-- Node 3: LLM Deliberation (lower right) -->
    <rect x="690" y="340" width="220" height="72" rx="14" fill="#15161D" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="800" y="370" text-anchor="middle" class="node-label">3. LLM Deliberation Engine</text>
    <text x="800" y="388" text-anchor="middle" class="node-sub">yoru-model-proxy</text>

    <!-- Node 4: Action Gatekeeper (bottom) -->
    <rect x="390" y="458" width="200" height="72" rx="14" fill="#15161D" stroke="#10B981" stroke-width="1.6"/>
    <text x="490" y="488" text-anchor="middle" class="node-label">4. Action Gatekeeper</text>
    <text x="490" y="506" text-anchor="middle" class="node-sub">Risk &amp; Approval Whitelist</text>

    <!-- Node 5: yoructl Dispatcher (lower left) -->
    <rect x="70" y="340" width="220" height="72" rx="14" fill="#15161D" stroke="#10B981" stroke-width="1.6"/>
    <text x="180" y="370" text-anchor="middle" class="node-label">5. yoructl Dispatcher</text>
    <text x="180" y="388" text-anchor="middle" class="node-sub">40 CIS Primitives Only</text>

    <!-- Node 6: Audit Sink (upper left) -->
    <rect x="70" y="150" width="220" height="72" rx="14" fill="#15161D" stroke="#E8B64C" stroke-width="1.6"/>
    <text x="180" y="180" text-anchor="middle" class="node-label">6. Closed-Loop Audit Sink</text>
    <text x="180" y="198" text-anchor="middle" class="node-sub">/var/log/audit/audit.log</text>

    <!-- Edges: hexagonal loop 1->2->3->4->5->6->1 -->
    <path d="M590,70 C650,90 690,120 760,155" stroke="#E8B64C" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="700" y="118" class="edge-label">1. Emits Raw Telemetry</text>

    <path d="M800,222 L800,338" stroke="#E8B64C" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="815" y="282" class="edge-label">2. Structured Context</text>

    <path d="M760,405 C690,440 650,455 590,480" stroke="#E8B64C" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="660" y="470" class="edge-label">3. Proposes Discrete Action</text>

    <path d="M390,490 C330,455 290,440 220,405" stroke="#E8B64C" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="250" y="470" class="edge-label">4. Authorizes Action</text>

    <path d="M180,338 L180,222" stroke="#E8B64C" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="190" y="282" class="edge-label">5. Traced under AUID=1001</text>

    <path d="M220,155 C290,120 330,90 390,68" stroke="#E8B64C" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="250" y="118" class="edge-label">6. Non-Repudiable Verification</text>

    <!-- center label -->
    <text x="490" y="265" text-anchor="middle" font-size="13" fill="#6F6C5E">Closed-Loop</text>
    <text x="490" y="285" text-anchor="middle" font-size="13" fill="#6F6C5E">Security Control</text>
  </svg>

  <div class="legend">
    <span><span class="dot" style="background:#E8B64C"></span> Kernel / Audit (trust boundary)</span>
    <span><span class="dot" style="background:#3B82F6"></span> Log Processing</span>
    <span><span class="dot" style="background:#F59E0B"></span> LLM Decision</span>
    <span><span class="dot" style="background:#10B981"></span> Enforcement / Execution</span>
  </div>
</div>
</body>
</html>
