name: YORU CI/CD Validation & Research Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "web/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy
          if [ -f "web/requirements.txt" ]; then pip install -r web/requirements.txt; fi

      - name: Run Core Validation Suite
        run: |
          chmod +x run_yoru_validation.sh check-all.sh demo.sh install.sh
          bash run_yoru_validation.sh

      - name: Run Empirical Research Benchmarks (RQ1 - RQ4)
        run: |
          python experiments/test_injection_to_action.py
          python experiments/test_rq2_auid_attribution.py
          python experiments/test_rq3_hardening_determinism.py
          python experiments/test_rq4_overhead.py

      - name: Generate Publication Figures
        run: |
          python experiments/plot_ablation.py
          python experiments/plot_resource_overhead.py

      - name: Archive Research Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yoru-research-results
          path: |
            experiments/results/
